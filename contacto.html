<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style.css">
    <title>Contacto - Lo quieres, te lo vendo</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1 class="titulo-principal">Lo quieres, te lo vendo</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#seccion-productos">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    
    <!-- PRINCIPAL -->
    <main>
        <section class="presentacion">
            <h2 class="mini-titulos">Ponte en contacto con nosotros</h2>
            <p class="textos">¿Tienes dudas sobre un pedido o buscas un producto especifico? ¡Escribenos!</p>    
        </section>

        <!-- CAJA FORMULARIO -->
        <section class="contenedor-formulario">
            <form action="#" class="formulario-contacto">
                
                <div class="grupo-input">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Nombre apellido" required>
                </div>

                <div class="grupo-input">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Tu mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe aquí tu consulta..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </section>
    </main>
    
    <!-- FOOTER -->
    <footer>
        <p id="texto-footer">Desarrollado por: Exequiel Romero, Nicolás Morales y Javier Tapia - 2026</p>
    </footer>
</body>
</html>
